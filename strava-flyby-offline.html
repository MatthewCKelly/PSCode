<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Flyby Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#1a1a1a;--surface:#242424;--surface2:#2e2e2e;--border:#3a3a3a;
      --text:#e8e8e8;--dim:#888;--accent:#fc5200;--accent2:#cc4400;
      --green:#2ecc71;--blue:#3498db;--yellow:#f39c12;--red:#e74c3c;
    }
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

    /* ── TOP BUTTONS BAR ── */
    #topbar{background:var(--surface);border-bottom:1px solid var(--border);
      padding:6px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
    .logo{font-weight:700;font-size:13px;color:var(--accent);white-space:nowrap}
    .sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
    .btn{padding:4px 10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);
      border-radius:4px;cursor:pointer;font-size:12px;white-space:nowrap;transition:background .12s}
    .btn:hover{background:var(--border)}
    .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn.pri:hover{background:var(--accent2)}
    .btn.active{border-color:var(--accent);color:var(--accent)}
    input[type=file]{display:none}

    /* ── TIMELINE BAR (full width) ── */
    #tlbar{background:var(--surface);border-bottom:1px solid var(--border);
      padding:5px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0}
    #play-btn{width:28px;height:28px;border-radius:50%;background:var(--accent);
      border:none;color:#fff;cursor:pointer;font-size:12px;display:flex;
      align-items:center;justify-content:center;flex-shrink:0}
    #play-btn:hover{background:var(--accent2)}
    .tlabel{font-size:11px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums;flex-shrink:0}
    #tl-wrap{flex:1;position:relative;height:44px;min-width:0;display:flex;align-items:center}
    #tl-canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;border-radius:3px}
    #timeline{position:absolute;left:0;width:100%;-webkit-appearance:none;
      height:4px;background:transparent;outline:none;cursor:pointer;z-index:2;top:60%}
    #timeline::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
      border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 4px rgba(0,0,0,.5)}
    #kf-hit{position:absolute;bottom:0;left:0;width:100%;height:16px;z-index:4;cursor:default}
    #kf-tip{position:absolute;bottom:calc(100% + 2px);background:rgba(0,0,0,.92);
      border:2px solid var(--accent);border-radius:6px;padding:3px 9px;font-size:11px;
      color:#fff;white-space:nowrap;pointer-events:none;display:none;z-index:20;
      transform:translateX(-50%)}
    #spd{background:var(--surface2);border:1px solid var(--border);color:var(--text);
      padding:3px 5px;border-radius:4px;font-size:12px;cursor:pointer;flex-shrink:0}
    .trim-btn{padding:3px 8px;border:1px solid var(--border);background:var(--surface2);
      color:var(--dim);border-radius:4px;cursor:pointer;font-size:11px;flex-shrink:0}
    .trim-btn:hover{background:var(--border)}
    .trim-btn.set{border-color:#f39c12;color:#f39c12}
    #trim-range{font-size:10px;color:#f39c12;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}

    /* ── MAIN ── */
    #main{display:flex;flex:1;overflow:hidden}

    /* sidebar */
    #sidebar{width:200px;background:var(--surface);border-right:1px solid var(--border);
      display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;
      transition:width .2s}
    #sidebar.collapsed{width:0;overflow:hidden}
    .ph{padding:7px 12px 4px;font-size:10px;font-weight:600;color:var(--dim);
      text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);
      flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
    .ph-sort{background:none;border:1px solid var(--border);color:var(--dim);
      border-radius:3px;font-size:9px;padding:1px 5px;cursor:pointer;white-space:nowrap}
    .ph-sort.active{border-color:var(--accent);color:var(--accent)}
    .apos{font-size:9px;color:var(--dim);font-weight:700;width:14px;text-align:right;flex-shrink:0}
    .apos.lead{color:var(--yellow)}
    .aprog{width:34px;height:3px;background:var(--border);border-radius:2px;margin-top:2px}
    .aprog-fill{height:100%;border-radius:2px;transition:width .3s}
    #alist{padding:3px 0;flex:1;overflow-y:auto}
    .aitem{display:flex;align-items:center;gap:7px;padding:5px 12px;cursor:pointer;
      transition:background .1s;user-select:none}
    .aitem:hover{background:var(--surface2)}
    .aitem.off{opacity:.35}
    .adot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .ainfo{flex:1;min-width:0}
    .aname{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ameta{font-size:9px;color:var(--dim)}
    .astatus{width:6px;height:6px;border-radius:50%;flex-shrink:0}
    .mybadge{display:inline-block;background:var(--accent);color:#fff;font-size:8px;
      padding:1px 3px;border-radius:2px;font-weight:700;letter-spacing:.4px}

    /* map */
    #mapwrap{flex:1;position:relative}
    #map{width:100%;height:100%}
    #nodatamsg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      text-align:center;color:var(--dim);pointer-events:none;z-index:500}
    #nodatamsg .ico{font-size:40px;margin-bottom:8px}
    #nodatamsg p{font-size:13px}
    #mapbadge{position:absolute;top:10px;right:10px;background:rgba(26,26,26,.88);
      border:1px solid var(--border);border-radius:6px;padding:4px 9px;font-size:11px;
      z-index:1000;pointer-events:none;display:none}
    #caption{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
      background:rgba(0,0,0,.87);border:2px solid var(--accent);border-radius:10px;
      padding:7px 16px;color:#fff;font-size:13px;font-weight:600;z-index:1000;
      pointer-events:none;max-width:75%;text-align:center;display:none;
      text-shadow:0 1px 3px rgba(0,0,0,.6)}

    /* Leaflet tooltip speech bubble */
    .flyby-tip{background:rgba(0,0,0,.88)!important;border:2px solid var(--accent)!important;
      border-radius:8px!important;color:#fff!important;font-weight:600!important;
      font-size:12px!important;padding:4px 10px!important;white-space:nowrap!important;
      box-shadow:0 2px 8px rgba(0,0,0,.5)!important}
    .flyby-tip.leaflet-tooltip-top::before{border-top-color:var(--accent)!important}

    /* ── METRICS / GAUGES ── */
    #metrics{height:160px;background:var(--surface);border-top:1px solid var(--border);
      display:flex;flex-shrink:0;overflow:hidden}
    .gauge-cell{flex:1;display:flex;flex-direction:column;align-items:center;
      justify-content:center;border-right:1px solid var(--border);padding:4px 0;min-width:0}
    .gauge-cell:last-child{border-right:none}
    #alt-cell{flex:2;align-items:stretch;padding:6px 10px 4px}
    .gauge-label{font-size:10px;font-weight:600;color:var(--dim);text-transform:uppercase;
      letter-spacing:.5px;margin-bottom:2px}
    .gauge-canvas-wrap{flex:1;width:100%;position:relative;min-height:0}
    .gauge-canvas-wrap canvas{position:absolute;inset:0;width:100%!important;height:100%!important}

    /* ── MODAL ── */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;
      align-items:center;justify-content:center;z-index:9999}
    .overlay.hide{display:none}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:8px;
      padding:22px;max-width:560px;width:90%;max-height:82vh;overflow-y:auto}
    .modal h2{font-size:15px;margin-bottom:10px}
    .modal h3{font-size:11px;color:var(--dim);margin:14px 0 5px;text-transform:uppercase;letter-spacing:.4px}
    .modal p{font-size:12px;line-height:1.65;color:var(--dim);margin-bottom:6px}
    .modal pre{background:var(--bg);border:1px solid var(--border);border-radius:4px;
      padding:9px 11px;font-size:11px;white-space:pre-wrap;word-break:break-all;
      color:var(--green);margin:6px 0;overflow-x:auto}
    .mfooter{margin-top:14px;display:flex;gap:8px;justify-content:flex-end}

    /* ── DRAG-DROP OVERLAY ── */
    #drop-overlay{position:fixed;inset:0;background:rgba(252,82,0,.18);
      border:4px dashed var(--accent);z-index:8000;
      display:none;align-items:center;justify-content:center;pointer-events:none}
    #drop-overlay.active{display:flex}
    #drop-overlay span{background:rgba(0,0,0,.85);color:#fff;font-size:18px;
      font-weight:700;padding:18px 36px;border-radius:12px;border:2px solid var(--accent)}

    /* ── TOAST ── */
    #toast{position:fixed;bottom:18px;right:18px;background:var(--surface2);border:1px solid var(--border);
      border-radius:6px;padding:8px 14px;font-size:12px;z-index:9998;
      transform:translateY(50px);opacity:0;transition:all .25s;pointer-events:none}
    #toast.show{transform:translateY(0);opacity:1}
    #toast.success{border-color:var(--green);color:var(--green)}
    #toast.error{border-color:var(--red);color:var(--red)}
    #toast.warn{border-color:var(--yellow);color:var(--yellow)}
  </style>
</head>
<body>

<!-- BUTTONS BAR -->
<div id="topbar">
  <span class="logo">⚡ Flyby Offline</span>
  <div class="sep"></div>
  <button class="btn pri author-only" onclick="$f('load-ath').click()" title="Select one or more flyby-export JSON files, or drag & drop onto the page">Load Athletes JSON ✦</button>
  <input type="file" id="load-ath" accept=".json" multiple onchange="loadAthletes(event)">
  <button class="btn author-only" onclick="$f('load-tl').click()">Load Timeline</button>
  <input type="file" id="load-tl" accept=".js,.json" onchange="loadTimeline(event)">
  <button class="btn author-only" onclick="$f('load-fit').click()">Load My FIT</button>
  <input type="file" id="load-fit" accept=".fit,.FIT" onchange="loadFit(event)">
  <button class="btn author-only" id="fit-rm" onclick="clearFit()" style="display:none">✕ FIT</button>
  <div class="sep author-only"></div>
  <button class="btn author-only" onclick="loadSample()">Sample</button>
  <button class="btn author-only" onclick="exportStandalone()">💾 Export HTML</button>
  <button class="btn" id="follow-btn" onclick="toggleFollow()" title="Keep me in frame">📍 Follow</button>
  <button class="btn" onclick="fitBounds()" title="Fit all">⛶ Fit</button>
</div>

<!-- TIMELINE BAR -->
<div id="tlbar">
  <button id="play-btn" onclick="togglePlay()">▶</button>
  <span class="tlabel" id="t-cur">0:00:00</span>
  <div id="tl-wrap">
    <canvas id="tl-canvas"></canvas>
    <div id="kf-tip"></div>
    <input type="range" id="timeline" min="0" max="100" value="0" oninput="scrub(event)">
    <div id="kf-hit"></div>
  </div>
  <span class="tlabel" id="t-tot">0:00:00</span>
  <div class="sep author-only" style="width:1px;height:20px;background:var(--border);flex-shrink:0"></div>
  <button class="trim-btn author-only" id="trim-in-btn"  onclick="setTrimStart()" title="Set trim start here [I]">⬤ In</button>
  <span id="trim-range" class="author-only" style="display:none"></span>
  <button class="trim-btn author-only" id="trim-out-btn" onclick="setTrimEnd()"   title="Set trim end here [O]">⬤ Out</button>
  <button class="trim-btn author-only" id="trim-clr-btn" onclick="clearTrim()"    title="Clear trim" style="display:none">✕ Trim</button>
  <div class="sep author-only" style="width:1px;height:20px;background:var(--border);flex-shrink:0"></div>
  <select id="spd" onchange="setSpeed(this.value)">
    <option value="1">1×</option>
    <option value="5">5×</option>
    <option value="10" selected>10×</option>
    <option value="30">30×</option>
    <option value="60">60×</option>
    <option value="120">120×</option>
  </select>
</div>

<!-- MAIN -->
<div id="main">
  <div id="sidebar">
    <div class="ph">
      <span>Athletes (<span id="acnt">0</span>)</span>
      <button class="ph-sort" id="sort-btn" onclick="toggleSort()" title="Toggle position sort">⇅ pos</button>
    </div>
    <div id="alist"><div style="padding:10px 12px;font-size:11px;color:var(--dim)">Load athletes JSON or click Sample</div></div>
  </div>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="nodatamsg"><div class="ico">🗺️</div><p>Load Athletes JSON or drag &amp; drop files here</p></div>
    <div id="mapbadge"><span id="badge-t">—</span></div>
    <div id="caption"></div>
  </div>
</div>

<!-- GAUGES + ALTITUDE -->
<div id="metrics">
  <div class="gauge-cell">
    <div class="gauge-label">Heart Rate</div>
    <div class="gauge-canvas-wrap"><canvas id="g-hr"></canvas></div>
  </div>
  <div class="gauge-cell">
    <div class="gauge-label">Power</div>
    <div class="gauge-canvas-wrap"><canvas id="g-pwr"></canvas></div>
  </div>
  <div class="gauge-cell">
    <div class="gauge-label">Cadence</div>
    <div class="gauge-canvas-wrap"><canvas id="g-cad"></canvas></div>
  </div>
  <div class="gauge-cell" id="temp-cell" style="display:none">
    <div class="gauge-label">Temp</div>
    <div class="gauge-canvas-wrap"><canvas id="g-temp"></canvas></div>
  </div>
  <div class="gauge-cell" id="alt-cell">
    <div class="gauge-label">Elevation</div>
    <div class="gauge-canvas-wrap"><canvas id="g-alt"></canvas></div>
  </div>
</div>

<!-- DRAG-DROP OVERLAY -->
<div id="drop-overlay"><span>Drop athlete JSON files here</span></div>

<!-- TOAST -->
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';

// ────────────────────────────────────────────────────────────────
// CONFIG  — set MY_ACTIVITY_ID to your Strava activity for follow-cam
// ────────────────────────────────────────────────────────────────

let MY_ACTIVITY_ID = '18340006598';
const CAPTION_TIMEOUT_SEC = 10;  // seconds before keyframe captions fade; 0 = stay forever

const COLORS = [
  '#fc5200','#4fc3f7','#81c784','#ffb74d','#f48fb1',
  '#ce93d8','#80deea','#a5d6a7','#ef9a9a','#90caf9',
  '#ffe082','#bcaaa4','#b0bec5','#c5e1a5','#ffcc02'
];

const GAUGE_META = [
  { key:'hr',   canvasId:'g-hr',   color:'#e74c3c', label:'bpm', src:'heartrate',   max:210, avg:true  },
  { key:'pwr',  canvasId:'g-pwr',  color:'#f39c12', label:'W',   src:'power',       max:600, avg:true  },
  { key:'cad',  canvasId:'g-cad',  color:'#2ecc71', label:'rpm', src:'cadence',     max:130, avg:true  },
  { key:'temp', canvasId:'g-temp', color:'#00bcd4', label:'°C',  src:'temperature', max:45,  avg:false },
];

const FIT_EPOCH = 631065600;

// ────────────────────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────────────────────

const S = {
  athletes:   [],
  me:         null,
  keyframes:  [],
  hidden:     new Set(),
  followCam:  true,
  sortMode:    'load',   // 'load' | 'position'
  sidebarOpen: true,
  hoveredKf:   null,
  trim:        { start:null, end:null },
  tl: { start:0, end:0, cur:0, playing:false, speed:10, lastTick:null },
  map:        null,
  markers:    {},
  tracks:     {},
  meMarker:   null,
  meTrack:    null,
  gauges:     {},
  lastKfUnix: null,
};

function $f(id){ return document.getElementById(id); }

// ────────────────────────────────────────────────────────────────
// FIT PARSER
// ────────────────────────────────────────────────────────────────

class FitParser {
  parse(buf) {
    const v = new DataView(buf), b = new Uint8Array(buf);
    if (b.length < 12) throw new Error('File too small');
    if (String.fromCharCode(b[8],b[9],b[10],b[11]) !== '.FIT') throw new Error('Not a FIT file');
    const hdr = v.getUint8(0), dataSize = v.getUint32(4,true);
    let off = hdr;
    const end = Math.min(hdr + dataSize, b.length - 2);
    const defs = {}, recs = [];
    while (off < end) {
      if (off >= b.length) break;
      const h = v.getUint8(off++);
      if (h & 0x80) {
        const d = defs[(h>>5)&3]; if(d){recs.push(this._data(v,off,d));off+=d.sz;} continue;
      }
      const isDef=!!(h&0x40), hasDev=!!(h&0x20), lt=h&0x0F;
      if (isDef) {
        off++; const le=v.getUint8(off++)===0;
        const gm=le?v.getUint16(off,true):v.getUint16(off,false); off+=2;
        const nf=v.getUint8(off++); const fields=[]; let sz=0;
        for(let i=0;i<nf;i++){const fn=v.getUint8(off++),fs=v.getUint8(off++),ft=v.getUint8(off++);fields.push({fn,fs,ft});sz+=fs;}
        if(hasDev){const nd=v.getUint8(off++);for(let i=0;i<nd;i++){sz+=v.getUint8(off+1);off+=3;}}
        defs[lt]={gm,le,fields,sz};
      } else {
        const d=defs[lt]; if(!d)break; recs.push(this._data(v,off,d)); off+=d.sz;
      }
    }
    return this._process(recs);
  }
  _data(v,off,def){const f={};let p=off;for(const fd of def.fields){f[fd.fn]=this._val(v,p,fd.fs,fd.ft,def.le);p+=fd.fs;}return{gm:def.gm,f};}
  _val(v,off,sz,bt,le){const t=bt&0x9F;try{switch(t){case 0:case 2:case 0x0A:return v.getUint8(off);case 1:return v.getInt8(off);case 0x83:return v.getInt16(off,le);case 0x84:case 0x8B:return v.getUint16(off,le);case 0x85:return v.getInt32(off,le);case 0x86:case 0x8C:return v.getUint32(off,le);case 0x88:return v.getFloat32(off,le);case 0x89:return v.getFloat64(off,le);case 7:{let s='';for(let i=0;i<sz;i++){const c=v.getUint8(off+i);if(!c)break;s+=String.fromCharCode(c);}return s;}default:return v.getUint8(off);}}catch(_){return null;}}
  _process(recs){
    const r={latlng:[],time:[],altitude:[],heartrate:[],cadence:[],power:[],distance:[],temperature:[]};
    let t0=null;
    for(const rec of recs){
      if(rec.gm!==20)continue;const f=rec.f;
      const ts=f[253];if(ts==null||ts===0xFFFFFFFF)continue;
      const unix=ts+FIT_EPOCH;if(!t0)t0=unix;r.time.push(Math.round(unix-t0));
      const lat=f[0],lng=f[1];
      r.latlng.push(lat!=null&&lat!==0x7FFFFFFF&&lng!=null&&lng!==0x7FFFFFFF?[lat*(180/2147483648),lng*(180/2147483648)]:null);
      // enhanced_altitude (field 78, UINT32) preferred; fall back to altitude (field 2, UINT16)
      const ealt=f[78], balt=f[2];
      let altVal=null;
      if(ealt!=null&&ealt!==0xFFFFFFFF) altVal=(ealt/5)-500;
      else if(balt!=null&&balt!==0xFFFF) altVal=(balt/5)-500;
      r.altitude.push(altVal);
      const hr=f[3];r.heartrate.push(hr!=null&&hr!==0xFF?hr:null);
      const cad=f[4];r.cadence.push(cad!=null&&cad!==0xFF?cad:null);
      const dist=f[5];r.distance.push(dist!=null&&dist!==0xFFFFFFFF?dist/100:null);
      const pwr=f[7];r.power.push(pwr!=null&&pwr!==0xFFFF?pwr:null);
      const tmp=f[13];r.temperature.push(tmp!=null&&tmp!==0x7F?tmp:null);
    }
    r.startTime=t0; r.duration=r.time.length?r.time[r.time.length-1]:0;
    return r;
  }
}

// ────────────────────────────────────────────────────────────────
// MAP
// ────────────────────────────────────────────────────────────────

function initMap() {
  S.map = L.map('map', { center:[51.505,-0.09], zoom:13, zoomControl:true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© OpenStreetMap', maxZoom:19
  }).addTo(S.map);
}

function mkIcon(color, size=12, ring=false) {
  const inner = ring
    ? `<div style="width:${size}px;height:${size}px;border-radius:50%;background:#fff;border:3px solid ${color};box-shadow:0 0 8px ${color}88"></div>`
    : `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.6)"></div>`;
  return L.divIcon({ className:'', html:inner, iconSize:[size,size], iconAnchor:[size/2,size/2] });
}

function redrawAthletes() {
  Object.values(S.markers).forEach(m=>m.remove());
  Object.values(S.tracks).forEach(t=>t.remove());
  S.markers={}; S.tracks={};

  if (!S.athletes.length) return;
  $f('nodatamsg').style.display = 'none';
  $f('mapbadge').style.display  = 'block';

  for (const a of S.athletes) {
    const coords = a.streams.latlng.filter(Boolean);
    if (!coords.length) continue;

    S.tracks[a.id] = L.polyline(coords, {color:a.color, weight:2, opacity:0.28}).addTo(S.map);

    const mk = L.marker(coords[0], {icon:mkIcon(a.color), zIndexOffset:500});
    mk.addTo(S.map);
    mk.bindTooltip(a.name, {
      permanent:false, direction:'top', offset:[0,-7],
      className:'flyby-tip'
    });
    S.markers[a.id] = mk;
  }
  fitBounds();
}

function redrawMe() {
  if (S.meMarker){S.meMarker.remove();S.meMarker=null;}
  if (S.meTrack) {S.meTrack.remove(); S.meTrack=null;}
  if (!S.me) return;
  const coords = S.me.latlng.filter(Boolean);
  if (!coords.length) return;
  S.meTrack = L.polyline(coords,{color:'#fff',weight:3,opacity:0.4,dashArray:'5 5'}).addTo(S.map);
  S.meMarker = L.marker(coords[0],{icon:mkIcon('#fc5200',16,true),zIndexOffset:2000}).addTo(S.map);
  S.meMarker.bindTooltip('You',{permanent:false,direction:'top',offset:[0,-9],className:'flyby-tip'});
}

function fitBounds() {
  const pts=[];
  S.athletes.forEach(a=>a.streams.latlng.filter(Boolean).forEach(p=>pts.push(p)));
  if(S.me)S.me.latlng.filter(Boolean).forEach(p=>pts.push(p));
  if(pts.length)S.map.fitBounds(L.latLngBounds(pts),{padding:[30,30]});
}

// ────────────────────────────────────────────────────────────────
// INTERPOLATION
// ────────────────────────────────────────────────────────────────

function posAt(streams, startTime, absT) {
  const rel=absT-startTime, times=streams.time, lls=streams.latlng;
  if(rel<0||!times.length||rel>times[times.length-1])return null;
  let lo=0,hi=times.length-1;
  while(lo<hi){const m=(lo+hi+1)>>1;times[m]<=rel?lo=m:hi=m-1;}
  const p0=lls[lo];
  if(!p0){for(let i=lo-1;i>=0;i--)if(lls[i])return lls[i];return null;}
  if(lo>=times.length-1)return p0;
  const p1=lls[lo+1];if(!p1)return p0;
  const t0=times[lo],t1=times[lo+1];if(t1===t0)return p0;
  const fr=(rel-t0)/(t1-t0);
  return[p0[0]+(p1[0]-p0[0])*fr,p0[1]+(p1[1]-p0[1])*fr];
}

function valAt(arr, times, rel) {
  if(!arr||!arr.length)return null;
  let lo=0,hi=times.length-1;
  while(lo<hi){const m=(lo+hi+1)>>1;times[m]<=rel?lo=m:hi=m-1;}
  return arr[lo]??null;
}

function avgAt(arr, times, rel, win=3) {
  if(!arr||!arr.length)return null;
  const lo=rel-win/2, hi=rel+win/2;
  // binary search to lo
  let i=0,j=times.length-1;
  while(i<j){const m=(i+j)>>1;times[m]<lo?i=m+1:j=m;}
  let sum=0,cnt=0;
  while(i<times.length&&times[i]<=hi){const v=arr[i];if(v!=null){sum+=v;cnt++;}i++;}
  return cnt?sum/cnt:null;
}

// ────────────────────────────────────────────────────────────────
// TIMELINE / KEYFRAMES
// ────────────────────────────────────────────────────────────────

function buildKeyframes(rawKfs) {
  const refUnix = S.tl.start || (Date.now()/1000);
  const refDate = new Date(refUnix*1000);

  S.keyframes = rawKfs.map(kf => {
    const [h,m,s] = kf.time.split(':').map(Number);
    const d = new Date(refDate);
    d.setHours(h, m, s||0, 0);
    return {
      time:     kf.time,
      unix:     d.getTime()/1000,
      caption:  kf.caption  || '',
      zoom:     kf.zoom     ?? 15,
      speed:    kf.speed    ?? 60,
      athletes: Object.prototype.hasOwnProperty.call(kf,'athletes') ? kf.athletes : null,
    };
  }).sort((a,b)=>a.unix-b.unix);

  console.log('[Timeline] Loaded ' + S.keyframes.length + ' keyframes:');
  S.keyframes.forEach((kf,i) => {
    const ath = kf.athletes===null ? 'all' : kf.athletes.length===0 ? 'me only' : kf.athletes.join(',');
    console.log(`  [${i}] ${kf.time}  zoom:${kf.zoom}  speed:${kf.speed}  athletes:${ath}  "${kf.caption}"`);
  });
}

function getActiveKf(t) {
  let active=null;
  for(const kf of S.keyframes){if(kf.unix<=t)active=kf;else break;}
  return active;
}

let _captionTmr=null;

function applyKf(kf) {
  if (!kf || kf.unix===S.lastKfUnix) return;
  S.lastKfUnix = kf.unix;
  console.log(`[KF] ${kf.time}  "${kf.caption}"`);

  // Caption
  clearTimeout(_captionTmr);
  const cap=$f('caption');
  if(kf.caption&&kf.caption.trim()){
    cap.textContent=kf.caption; cap.style.display='block';
    if(CAPTION_TIMEOUT_SEC>0)
      _captionTmr=setTimeout(()=>cap.style.display='none', CAPTION_TIMEOUT_SEC*1000);
  } else {
    cap.style.display='none';
  }

  // Speed
  S.tl.speed = kf.speed;
  $f('spd').value = [1,5,10,30,60,120].reduce((prev,curr) =>
    Math.abs(curr-kf.speed)<Math.abs(prev-kf.speed)?curr:prev, 10);

  // Athlete filter
  applyAthleteFilter(kf.athletes);

  // Zoom (gentle)
  if(kf.zoom && S.map) S.map.setZoom(kf.zoom,{animate:false});
}

function applyAthleteFilter(athletes) {
  for (const a of S.athletes) {
    let show;
    if (athletes===null) {
      show = true;
    } else if (athletes.length===0) {
      show = (a.id===MY_ACTIVITY_ID || a.athleteId===MY_ACTIVITY_ID);
    } else {
      const ids = athletes.map(String);
      show = ids.includes(a.athleteId) || ids.includes(a.id) || a.id===MY_ACTIVITY_ID;
    }
    show ? S.hidden.delete(a.id) : S.hidden.add(a.id);
    const mk=S.markers[a.id], tr=S.tracks[a.id];
    if(mk) mk.setOpacity(show?1:0);
    if(tr) tr.setStyle({opacity:show?0.28:0});
  }
  renderList();
}

// ────────────────────────────────────────────────────────────────
// SEEK / TIMELINE
// ────────────────────────────────────────────────────────────────

function recomputeRange() {
  const starts=[], ends=[];
  for(const a of S.athletes){
    starts.push(a.startTime);
    ends.push(a.endTime || a.startTime+(a.streams.time[a.streams.time.length-1]||0));
  }
  if(S.me?.startTime){starts.push(S.me.startTime);ends.push(S.me.startTime+S.me.duration);}
  if(!starts.length)return;
  const dataStart=Math.min(...starts), dataEnd=Math.max(...ends);
  S.tl.start = S.trim.start ? Math.max(S.trim.start, dataStart) : dataStart;
  S.tl.end   = S.trim.end   ? Math.min(S.trim.end,   dataEnd)   : dataEnd;
  if(S.tl.cur<S.tl.start)S.tl.cur=S.tl.start;
  $f('t-tot').textContent=fmtDur(S.tl.end-S.tl.start);
  S.lastKfUnix=null;
  drawTimeline();
}

function setTrimStart() {
  S.trim.start=S.tl.cur;
  if(S.trim.end&&S.trim.end<=S.trim.start) S.trim.end=null;
  recomputeRange(); updateTrimUI();
  toast('Trim start: '+fmtTime(S.trim.start),'info');
}
function setTrimEnd() {
  S.trim.end=S.tl.cur;
  if(S.trim.start&&S.trim.start>=S.trim.end) S.trim.start=null;
  recomputeRange(); updateTrimUI();
  toast('Trim end: '+fmtTime(S.trim.end),'info');
}
function clearTrim() {
  S.trim={start:null,end:null};
  recomputeRange(); updateTrimUI();
  toast('Trim cleared','warn');
}
function updateTrimUI() {
  const hasIn=S.trim.start!=null, hasOut=S.trim.end!=null, hasTrim=hasIn||hasOut;
  $f('trim-in-btn').classList.toggle('set',hasIn);
  $f('trim-out-btn').classList.toggle('set',hasOut);
  $f('trim-clr-btn').style.display=hasTrim?'':'none';
  const rng=$f('trim-range');
  if(hasTrim){
    const s=hasIn?fmtTime(S.trim.start):'start';
    const e=hasOut?fmtTime(S.trim.end):'end';
    rng.textContent=s+' → '+e;
    rng.style.display='';
  } else {
    rng.style.display='none';
  }
}

function drawTimeline() {
  const canvas=$f('tl-canvas');
  if(!canvas)return;
  const dur=S.tl.end-S.tl.start;
  const dpr=window.devicePixelRatio||1;
  const W=canvas.offsetWidth||canvas.parentElement?.offsetWidth||200;
  const H=canvas.offsetHeight||36;
  canvas.width=W*dpr; canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  // Track groove
  const grooveY=H*0.6, grooveH=4;
  ctx.fillStyle='rgba(255,255,255,0.1)';
  ctx.beginPath(); ctx.roundRect(0,grooveY-grooveH/2,W,grooveH,2); ctx.fill();

  if(!dur){return;}
  const toX=t=>((t-S.tl.start)/dur)*W;

  // Time tick intervals: try 1h, 30m, 15m depending on duration
  const intervals=[[3600,'rgba(255,255,255,0.35)',12,true],[1800,'rgba(255,255,255,0.2)',8,false],[900,'rgba(255,255,255,0.13)',5,false]];
  for(const[iv,col,th,label] of intervals){
    if(dur/iv<2)continue;
    const t0=Math.ceil(S.tl.start/iv)*iv;
    for(let t=t0;t<=S.tl.end;t+=iv){
      const x=toX(t);
      ctx.strokeStyle=col; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x,grooveY-grooveH/2-1); ctx.lineTo(x,grooveY-grooveH/2-th); ctx.stroke();
      if(label){
        ctx.fillStyle='rgba(255,255,255,0.28)';
        ctx.font=`9px -apple-system,sans-serif`; ctx.textAlign='center';
        ctx.fillText(fmtHHMM(t),x,grooveY-grooveH/2-th-3);
      }
    }
  }

  // Keyframe diamond markers
  const hovKf=S.hoveredKf;
  for(const kf of S.keyframes){
    const x=toX(kf.unix);
    if(x<0||x>W)continue;
    const ky=grooveY+9, ks=kf===hovKf?6:4;
    ctx.fillStyle=kf===hovKf?'#ff8a50':'#fc5200';
    if(kf===hovKf){ctx.shadowColor='#fc520088';ctx.shadowBlur=8;}
    ctx.beginPath(); ctx.moveTo(x,ky-ks); ctx.lineTo(x+ks,ky); ctx.lineTo(x,ky+ks); ctx.lineTo(x-ks,ky); ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
  }
}

function initKfHit() {
  const hit=$f('kf-hit'), tip=$f('kf-tip');
  if(!hit||!tip)return;

  function kfAtX(clientX) {
    if(!S.keyframes.length||!S.tl.end||S.tl.end<=S.tl.start)return null;
    const rect=hit.getBoundingClientRect();
    const x=clientX-rect.left, W=rect.width;
    const dur=S.tl.end-S.tl.start;
    const THRESH=8;
    let best=null,bestDx=Infinity;
    for(const kf of S.keyframes){
      const kx=((kf.unix-S.tl.start)/dur)*W;
      const dx=Math.abs(x-kx);
      if(dx<THRESH&&dx<bestDx){best=kf;bestDx=dx;}
    }
    return best;
  }

  hit.addEventListener('mousemove',e=>{
    const kf=kfAtX(e.clientX);
    if(kf!==S.hoveredKf){
      S.hoveredKf=kf;
      drawTimeline();
    }
    if(kf&&kf.caption){
      const rect=hit.getBoundingClientRect();
      const dur=S.tl.end-S.tl.start;
      const x=((kf.unix-S.tl.start)/dur)*rect.width;
      tip.textContent=`${kf.time} — ${kf.caption}`;
      tip.style.left=x+'px';
      tip.style.display='block';
      hit.style.cursor='pointer';
    } else {
      tip.style.display='none';
      hit.style.cursor='default';
    }
  });

  hit.addEventListener('mouseleave',()=>{
    S.hoveredKf=null; tip.style.display='none'; drawTimeline();
  });

  hit.addEventListener('click',e=>{
    const kf=kfAtX(e.clientX);
    if(kf){
      S.lastKfUnix=null; // force reapply
      seekTo(kf.unix);
      toast(`${kf.time} — ${kf.caption||'keyframe'}`, 'info');
    }
  });
}

function fmtDur(sec){const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60);return`${h}:${pad(m)}:${pad(s)}`;}
function fmtTime(unix){const d=new Date(unix*1000);return`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;}
function fmtHHMM(unix){const d=new Date(unix*1000);return`${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function pad(n){return String(n).padStart(2,'0');}

function seekTo(t) {
  S.tl.cur=Math.max(S.tl.start,Math.min(S.tl.end,t));
  const el=S.tl.cur-S.tl.start, tot=S.tl.end-S.tl.start||1;
  $f('t-cur').textContent=fmtDur(el);
  $f('badge-t').textContent=fmtTime(S.tl.cur);
  $f('timeline').value=(el/tot)*100;

  // Apply active keyframe
  applyKf(getActiveKf(S.tl.cur));

  let followPos=null;

  // Move athlete markers
  for(const a of S.athletes){
    if(S.hidden.has(a.id))continue;
    const mk=S.markers[a.id];if(!mk)continue;
    const pos=posAt(a.streams,a.startTime,S.tl.cur);
    mk.setOpacity(pos?1:0);
    if(pos){
      mk.setLatLng(pos);
      if(a.id===MY_ACTIVITY_ID&&!S.me)followPos=pos;
    }
    const dot=document.querySelector(`[data-aid="${a.id}"] .astatus`);
    if(dot)dot.style.background=pos?a.color:'transparent';
  }

  // Move "me" marker
  if(S.me&&S.meMarker){
    const pos=posAt(S.me,S.me.startTime,S.tl.cur);
    S.meMarker.setOpacity(pos?1:0);
    if(pos){S.meMarker.setLatLng(pos);followPos=pos;}
  }

  // Follow-cam
  if(S.followCam&&followPos&&S.map){
    S.map.panTo(followPos,{animate:false,duration:0});
  }

  updateGauges();
  if(S.sortMode==='position')renderList();
}

function updateGauges() {
  const rel=S.me?S.tl.cur-S.me.startTime:null;
  if(!S.me||rel===null||rel<0||rel>S.me.duration){
    GAUGE_META.forEach(m=>{if(S.gauges[m.key])drawGauge(S.gauges[m.key],null,m.max,m.color,m.label);});
  } else {
    GAUGE_META.forEach(m=>{
      if(!S.gauges[m.key])return;
      const v=m.avg?avgAt(S.me[m.src],S.me.time,rel):valAt(S.me[m.src],S.me.time,rel);
      drawGauge(S.gauges[m.key],v,m.max,m.color,m.label);
    });
  }
  drawAltChart();
}

// ────────────────────────────────────────────────────────────────
// PLAYBACK
// ────────────────────────────────────────────────────────────────

let raf=null;

function togglePlay(){
  S.tl.playing=!S.tl.playing;
  $f('play-btn').innerHTML=S.tl.playing?'⏸':'▶';
  if(S.tl.playing){S.tl.lastTick=performance.now();raf=requestAnimationFrame(tick);}
  else if(raf)cancelAnimationFrame(raf);
}

function tick(now){
  if(!S.tl.playing)return;
  const dt=(now-S.tl.lastTick)/1000;S.tl.lastTick=now;
  const next=S.tl.cur+dt*S.tl.speed;
  if(next>=S.tl.end){seekTo(S.tl.end);S.tl.playing=false;$f('play-btn').innerHTML='▶';return;}
  seekTo(next);raf=requestAnimationFrame(tick);
}

function setSpeed(v){S.tl.speed=parseFloat(v);}

function scrub(e){
  if(S.tl.playing)togglePlay();
  S.lastKfUnix=null;
  seekTo(S.tl.start+(e.target.value/100)*(S.tl.end-S.tl.start));
}

function toggleFollow(){
  S.followCam=!S.followCam;
  $f('follow-btn').classList.toggle('active',S.followCam);
  if(S.followCam)toast('Follow-cam ON','success');
  else toast('Follow-cam OFF','warn');
}

// ────────────────────────────────────────────────────────────────
// GAUGES  (arc dial)
// ────────────────────────────────────────────────────────────────

function initGauges(){
  GAUGE_META.forEach(m=>{
    const canvas=$f(m.canvasId);
    if(!canvas)return;
    S.gauges[m.key]=canvas;
    drawGauge(canvas,null,m.max,m.color,m.label);
  });
}

function showTempGauge(hasTemp){
  const cell=$f('temp-cell');
  if(cell)cell.style.display=hasTemp?'':'none';
  if(hasTemp&&!S.gauges.temp){
    const c=$f('g-temp');S.gauges.temp=c;
    drawGauge(c,null,45,'#00bcd4','°C');
  }
}

function drawGauge(canvas, value, max, color, unit){
  const wrap=canvas.parentElement;
  const dpr=window.devicePixelRatio||1;
  const W=wrap.clientWidth||120, H=wrap.clientHeight||120;
  canvas.width=W*dpr; canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  const cx=W/2, cy=H*0.62;
  const r=Math.min(W*0.4,H*0.55);
  const lw=Math.max(5,r*0.13);
  const START=Math.PI*0.78, SPAN=Math.PI*1.44;

  // Background arc
  ctx.beginPath();
  ctx.arc(cx,cy,r,START,START+SPAN);
  ctx.strokeStyle='rgba(255,255,255,0.1)';
  ctx.lineWidth=lw; ctx.lineCap='round'; ctx.stroke();

  // Value arc
  if(value!=null&&!isNaN(value)){
    const frac=Math.min(Math.max(value/max,0),1);
    // Gradient tint by fraction
    const g=ctx.createLinearGradient(cx-r,cy,cx+r,cy);
    g.addColorStop(0,color+'aa'); g.addColorStop(1,color);
    ctx.beginPath();
    ctx.arc(cx,cy,r,START,START+frac*SPAN);
    ctx.strokeStyle=g; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.stroke();
  }

  // Value text
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(value!=null&&!isNaN(value)){
    ctx.fillStyle='#fff';
    ctx.font=`bold ${Math.round(r*0.52)}px -apple-system,sans-serif`;
    ctx.fillText(Math.round(value),cx,cy+r*0.08);
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.font=`${Math.round(r*0.24)}px sans-serif`;
    ctx.fillText(unit,cx,cy+r*0.48);
  } else {
    ctx.fillStyle='rgba(255,255,255,0.2)';
    ctx.font=`${Math.round(r*0.45)}px sans-serif`;
    ctx.fillText('—',cx,cy+r*0.1);
  }

  // Tick marks (min / mid / max)
  ctx.strokeStyle='rgba(255,255,255,0.18)';
  ctx.lineWidth=1;
  [0,0.5,1].forEach(f=>{
    const a=START+f*SPAN;
    const x1=cx+(r-lw)*Math.cos(a), y1=cy+(r-lw)*Math.sin(a);
    const x2=cx+(r+lw*0.5)*Math.cos(a), y2=cy+(r+lw*0.5)*Math.sin(a);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  });
}

function resizeGauges(){
  GAUGE_META.forEach(m=>{
    const canvas=S.gauges[m.key];if(!canvas)return;
    const v=S.me?valAt(S.me[m.src],S.me.time,S.tl.cur-S.me.startTime):null;
    drawGauge(canvas,v,m.max,m.color,m.label);
  });
  drawAltChart();
  drawTimeline();
}

function drawAltChart() {
  const canvas=$f('g-alt');
  if(!canvas)return;
  // Prefer FIT altitude, fall back to my athlete's GPS altitude
  let altArr=null, timeArr=null, startTime=null, duration=null;
  if(S.me&&S.me.altitude&&S.me.altitude.some(v=>v!=null)){
    altArr=S.me.altitude; timeArr=S.me.time; startTime=S.me.startTime; duration=S.me.duration;
  } else {
    const me=S.athletes.find(a=>a.id===MY_ACTIVITY_ID||a.athleteId===MY_ACTIVITY_ID);
    if(me&&me.streams.altitude&&me.streams.altitude.some(v=>v!=null)){
      altArr=me.streams.altitude; timeArr=me.streams.time; startTime=me.startTime;
      duration=me.streams.time[me.streams.time.length-1]||0;
    }
  }

  const wrap=canvas.parentElement;
  const dpr=window.devicePixelRatio||1;
  const W=wrap.clientWidth||200, H=wrap.clientHeight||100;
  canvas.width=W*dpr; canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  if(!altArr||!timeArr||!duration){
    ctx.fillStyle='rgba(255,255,255,0.1)';
    ctx.font=`11px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('No elevation data',W/2,H/2);
    return;
  }

  // Filter valid points
  const pts=[];
  for(let i=0;i<timeArr.length;i++){if(altArr[i]!=null)pts.push({t:timeArr[i],a:altArr[i]});}
  if(pts.length<2){ctx.fillStyle='rgba(255,255,255,0.1)';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('No elevation data',W/2,H/2);return;}

  const minA=Math.min(...pts.map(p=>p.a));
  const maxA=Math.max(...pts.map(p=>p.a));
  const rangeA=Math.max(1,maxA-minA);
  const pad=8;
  const toX=t=>(t/duration)*(W-pad*2)+pad;
  const toY=a=>H-pad-(a-minA)/rangeA*(H-pad*2.5);

  // Filled area
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'rgba(52,152,219,0.55)');
  grad.addColorStop(1,'rgba(52,152,219,0.05)');
  ctx.beginPath(); ctx.moveTo(toX(pts[0].t),H);
  pts.forEach(p=>ctx.lineTo(toX(p.t),toY(p.a)));
  ctx.lineTo(toX(pts[pts.length-1].t),H); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();

  // Line
  ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(toX(p.t),toY(p.a)):ctx.moveTo(toX(p.t),toY(p.a)));
  ctx.strokeStyle='rgba(52,152,219,0.85)'; ctx.lineWidth=1.5; ctx.lineJoin='round'; ctx.stroke();

  // Playhead
  if(startTime&&S.tl.cur>=startTime&&S.tl.cur<=startTime+duration){
    const rel=S.tl.cur-startTime;
    const px=toX(rel);
    // Current altitude value
    const curAlt=valAt(altArr,timeArr,rel);
    ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(px,0); ctx.lineTo(px,H); ctx.stroke(); ctx.setLineDash([]);
    if(curAlt!=null){
      const py=toY(curAlt);
      ctx.fillStyle='#3498db'; ctx.beginPath(); ctx.arc(px,py,3,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font=`bold 9px sans-serif`; ctx.textAlign='left'; ctx.textBaseline='bottom';
      ctx.fillText(Math.round(curAlt)+'m',px+4,py-1);
    }
  }

  // Min/Max labels
  ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.font=`9px sans-serif`; ctx.textAlign='right'; ctx.textBaseline='top';
  ctx.fillText(Math.round(maxA)+'m',W-2,pad);
  ctx.textBaseline='bottom';
  ctx.fillText(Math.round(minA)+'m',W-2,H-2);
}

// ────────────────────────────────────────────────────────────────
// ATHLETE LIST UI
// ────────────────────────────────────────────────────────────────

function positionFrac(a) {
  if(S.tl.cur < a.startTime) return -1;
  if(S.tl.cur > a.endTime) return 2 + (a.endTime - a.startTime); // finished; lower = faster
  return (S.tl.cur - a.startTime) / Math.max(1, a.endTime - a.startTime);
}

function toggleSort() {
  S.sortMode = S.sortMode==='position' ? 'load' : 'position';
  $f('sort-btn').classList.toggle('active', S.sortMode==='position');
  renderList();
}

function toggleSidebar() {
  S.sidebarOpen = !S.sidebarOpen;
  $f('sidebar').classList.toggle('collapsed', !S.sidebarOpen);
  setTimeout(()=>S.map&&S.map.invalidateSize(),220);
}

function renderList(){
  $f('acnt').textContent=S.athletes.length;
  const list=$f('alist');

  if(!S.athletes.length){
    list.innerHTML='<div style="padding:10px 12px;font-size:11px;color:var(--dim)">Load athletes JSON or click Sample</div>';
  } else {
    let athletes=[...S.athletes];
    if(S.sortMode==='position'){
      athletes.sort((a,b)=>{
        const fa=positionFrac(a), fb=positionFrac(b);
        // Both finished: faster finish (lower endTime) first
        if(fa>=2&&fb>=2) return a.endTime-b.endTime;
        if(fa>=2) return -1; if(fb>=2) return 1;
        // Both not started: keep load order
        if(fa<0&&fb<0) return 0;
        if(fa<0) return 1; if(fb<0) return -1;
        // Both active: further ahead first
        return fb-fa;
      });
    }
    list.innerHTML=athletes.map((a,rank)=>{
      const dur=fmtDur(a.streams.time[a.streams.time.length-1]||0);
      const isMe=a.id===MY_ACTIVITY_ID;
      const frac=positionFrac(a);
      const active=frac>=0&&frac<2;
      const finished=frac>=2;
      let statusMeta='';
      if(S.sortMode==='position'){
        if(finished) statusMeta=`<span style="color:var(--green)">✓ ${fmtDur(a.endTime-a.startTime)}</span>`;
        else if(active) statusMeta=`<span style="color:var(--dim)">${Math.round(Math.min(frac,1)*100)}%</span>`;
        else statusMeta=`<span style="color:var(--dim)">waiting</span>`;
      }
      const rankBadge=S.sortMode==='position'?`<span class="apos${rank===0?' lead':''}">${rank+1}</span>`:'';
      const progBar=S.sortMode==='position'&&active
        ?`<div class="aprog"><div class="aprog-fill" style="width:${Math.round(Math.min(frac,1)*100)}%;background:${a.color}"></div></div>`:''
      ;
      return`<div class="aitem${S.hidden.has(a.id)?' off':''}" data-aid="${a.id}" onclick="toggleAth('${a.id}')">
        ${rankBadge}
        <div class="adot" style="background:${a.color}${isMe?';border:2px solid #fff':''}"></div>
        <div class="ainfo">
          <div class="aname">${esc(a.name)}${isMe?'<span class="mybadge" style="margin-left:4px">ME</span>':''}</div>
          <div class="ameta">${statusMeta||dur}</div>
          ${progBar}
        </div>
        <div class="astatus" style="background:${a.color}"></div>
      </div>`;
    }).join('');
  }

  if(S.me){
    list.innerHTML+=`<div style="margin-top:5px;border-top:1px solid var(--border);padding-top:5px">
      <div class="aitem" style="cursor:default">
        <div class="adot" style="background:#fc5200;border:2px solid #fff;box-sizing:border-box"></div>
        <div class="ainfo">
          <div class="aname">You <span class="mybadge">FIT</span></div>
          <div class="ameta">${fmtDur(S.me.duration)}</div>
        </div>
      </div></div>`;
  }
}

function toggleAth(id){
  S.hidden.has(id)?S.hidden.delete(id):S.hidden.add(id);
  const mk=S.markers[id],tr=S.tracks[id];
  if(S.hidden.has(id)){if(mk)mk.setOpacity(0);if(tr)tr.setStyle({opacity:0});}
  else{if(tr)tr.setStyle({opacity:0.28});seekTo(S.tl.cur);}
  renderList();
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ────────────────────────────────────────────────────────────────
// NORMALISE ATHLETE JSON
// ────────────────────────────────────────────────────────────────

function normalise(raw, i, colorHint) {
  const color = raw.color || colorHint || COLORS[i % COLORS.length];
  const id    = String(raw.id || raw.activity_id || raw.activityId || i);

  let streams = raw.streams || {};
  if (streams.latlng?.data) {
    streams = {
      latlng:   streams.latlng.data   || [],
      time:     (streams.time||{}).data     || [],
      altitude: (streams.altitude||{}).data || [],
    };
  }

  let startTime = raw.startTime ?? raw.start_time ?? null;
  if (typeof startTime==='string') startTime=Date.parse(startTime)/1000;
  if (!startTime) startTime=Date.now()/1000;

  const name = raw.name ||
    (raw.athlete?`${raw.athlete.firstName||raw.athlete.firstname||''} ${raw.athlete.lastName||raw.athlete.lastname||''}`.trim():null) ||
    raw.athlete_name || `Athlete ${i+1}`;

  const athleteId = String(raw.athleteId || raw.athlete_id ||
    (raw.athlete&&(raw.athlete.id||raw.athlete.athleteId)) || '');

  const times = streams.time || [];
  const endTime = startTime + (times[times.length-1]||0);

  return { id, athleteId, name, startTime, endTime, color,
           streams:{ latlng:streams.latlng||[], time:times, altitude:streams.altitude||[] } };
}

// ────────────────────────────────────────────────────────────────
// FILE LOADING
// ────────────────────────────────────────────────────────────────

async function loadAthletes(e) {
  const files=Array.from(e.target.files); e.target.value='';
  if(!files.length)return;
  let totalAdded=0, totalMerged=0;

  for(const file of files){
    console.log(`[Import] ${file.name} (${Math.round(file.size/1024)} KB)`);
    try{
      const raw=JSON.parse(await file.text());
      const arr=Array.isArray(raw)?raw:(raw.athletes||raw.activities||raw.data||[]);
      console.log(`[Import] ${file.name}: ${arr.length} athletes found`);

      arr.forEach((a,i)=>{
        const norm=normalise(a,i);
        if(!norm.streams.latlng.some(Boolean)){
          console.warn(`[Import]   skip "${norm.name}" — no valid GPS`);return;
        }
        const existing=S.athletes.find(e=>e.id===norm.id);
        if(existing){
          // Merge streams
          console.log(`[Import]   merge "${norm.name}" (id:${norm.id}) — ${norm.streams.time.length} pts + existing ${existing.streams.time.length} pts`);
          mergeStreams(existing,norm);
          totalMerged++;
        } else {
          S.athletes.push(norm);
          console.log(`[Import]   add "${norm.name}" (id:${norm.id}, athleteId:${norm.athleteId}, ${norm.streams.time.length} pts, color:${norm.color})`);
          totalAdded++;
        }
      });
    }catch(err){
      console.error(`[Import] ${file.name}: ${err.message}`);
      toast(`Error in ${file.name}: ${err.message}`,'error');
    }
  }

  console.log(`[Import] Done — added:${totalAdded} merged:${totalMerged} total:${S.athletes.length}`);
  recomputeRange();
  redrawAthletes();
  renderList();
  seekTo(S.tl.start);
  toast(`${S.athletes.length} athletes loaded (${totalAdded} new, ${totalMerged} merged)`,'success');
}

function mergeStreams(target, src) {
  // Combine by absolute time, deduplicate, re-sort
  const baseTime = target.startTime;
  const combined = [];
  const addPts = (streams, start) => {
    for(let i=0;i<streams.time.length;i++){
      const absT=start+streams.time[i];
      combined.push({absT, ll:streams.latlng[i], alt:streams.altitude?streams.altitude[i]:null});
    }
  };
  addPts(target.streams, target.startTime);
  addPts(src.streams, src.startTime);
  combined.sort((a,b)=>a.absT-b.absT);
  // Deduplicate by absT
  const seen=new Set();
  const uniq=combined.filter(p=>{if(seen.has(p.absT))return false;seen.add(p.absT);return true;});
  target.startTime=uniq[0].absT;
  target.endTime=uniq[uniq.length-1].absT;
  target.streams.time=uniq.map(p=>Math.round(p.absT-target.startTime));
  target.streams.latlng=uniq.map(p=>p.ll);
  target.streams.altitude=uniq.map(p=>p.alt);
}

async function loadTimeline(e) {
  const file=e.target.files[0]; if(!file)return; e.target.value='';
  console.log(`[Timeline] Loading ${file.name}...`);
  try{
    let text=await file.text();
    let kfRaw=null;
    try{ kfRaw=JSON.parse(text); }
    catch(_){
      // Strip JS variable declaration: const TIMELINE = [...];
      const m=text.match(/=\s*(\[[\s\S]*?\]);?\s*$/m)||text.match(/(\[[\s\S]*\])/);
      if(m) kfRaw=new Function('return '+m[1])();
    }
    if(!Array.isArray(kfRaw))throw new Error('Expected an array of keyframe objects');
    if(!S.tl.start)console.warn('[Timeline] No athletes loaded yet — times will be computed against today\'s date');
    buildKeyframes(kfRaw);
    S.lastKfUnix=null;
    drawTimeline();
    toast(`Timeline: ${S.keyframes.length} keyframes`,'success');
  }catch(err){
    console.error(`[Timeline] ${err.message}`);
    toast('Timeline error: '+err.message,'error');
  }
}

async function loadFit(e) {
  const file=e.target.files[0]; if(!file)return; e.target.value='';
  console.log(`[FIT] Loading ${file.name} (${Math.round(file.size/1024)} KB)...`);
  try{
    const data=new FitParser().parse(await file.arrayBuffer());
    if(!data.time.length)throw new Error('No GPS records found');
    S.me=data;
    const hasAlt=data.altitude.some(v=>v!=null);
    const hasTemp=data.temperature.some(v=>v!=null);
    console.log(`[FIT] ${data.time.length} records  HR:${data.heartrate.some(v=>v!=null)}  Power:${data.power.some(v=>v!=null)}  Cadence:${data.cadence.some(v=>v!=null)}  Alt:${hasAlt}  Temp:${hasTemp}`);
    showTempGauge(hasTemp);
    redrawMe();
    recomputeRange();
    renderList();
    seekTo(S.tl.cur);
    $f('fit-rm').style.display='';
    toast(`FIT loaded · ${data.time.length} pts${hasTemp?' · 🌡️ temp':''}${hasAlt?' · ⛰️ alt':''}`);
  }catch(err){
    console.error(`[FIT] ${err.message}`);
    toast('FIT error: '+err.message,'error');
  }
}

function clearFit(){
  S.me=null; showTempGauge(false); S.gauges.temp=null;
  if(S.meMarker){S.meMarker.remove();S.meMarker=null;}
  if(S.meTrack){S.meTrack.remove();S.meTrack=null;}
  GAUGE_META.forEach(m=>drawGauge(S.gauges[m.key],null,m.max,m.color,m.label));
  $f('fit-rm').style.display='none';
  recomputeRange(); renderList();
  toast('FIT removed','warn');
}

function loadSample(){
  const BASE=Math.floor(Date.now()/1000)-7200;
  function mkRoute(latOff,lngOff,secs){
    const ll=[],t=[];let lat=51.505+latOff,lng=-0.09+lngOff;
    for(let i=0;i<120;i++){lat+=(Math.random()-.48)*.0006;lng+=(Math.random()-.45)*.0008;ll.push([lat,lng]);t.push(i*secs);}
    return{latlng:ll,time:t,altitude:[]};
  }
  S.athletes=[
    {id:'s1',athleteId:'1001',name:'Alice', startTime:BASE,     endTime:BASE+360,  color:'#4fc3f7',streams:mkRoute(0,0,3)},
    {id:'s2',athleteId:'1002',name:'Bob',   startTime:BASE+120, endTime:BASE+600,  color:'#81c784',streams:mkRoute(.002,-.003,4)},
    {id:'s3',athleteId:'1003',name:'Charlie',startTime:BASE+300,endTime:BASE+720, color:'#ffb74d',streams:mkRoute(-.001,.002,3.5)},
  ];
  recomputeRange(); redrawAthletes(); renderList(); seekTo(S.tl.start);
  toast('Sample loaded — try Play ▶','success');
}

// ────────────────────────────────────────────────────────────────
// STANDALONE EXPORT
// ────────────────────────────────────────────────────────────────

// ── stream trimming helpers ───────────────────────────────────────

function trimAthleteStream(a, tStart, tEnd) {
  const times=a.streams.time, n=times.length;
  const relS=tStart-a.startTime, relE=tEnd-a.startTime;
  let i0=0; while(i0<n&&times[i0]<relS)i0++;
  let i1=n-1; while(i1>i0&&times[i1]>relE)i1--;
  if(i0>i1)return null;
  const offset=times[i0];
  const sl=(arr)=>arr?arr.slice(i0,i1+1):[];
  return{...a,
    startTime: a.startTime+offset,
    endTime:   a.startTime+times[i1],
    streams:{
      latlng:   sl(a.streams.latlng),
      time:     sl(times).map(t=>t-offset),
      altitude: sl(a.streams.altitude),
    }
  };
}

function trimFitStream(me, tStart, tEnd) {
  if(!me)return null;
  const times=me.time, n=times.length;
  const relS=tStart-me.startTime, relE=tEnd-me.startTime;
  let i0=0; while(i0<n&&times[i0]<relS)i0++;
  let i1=n-1; while(i1>i0&&times[i1]>relE)i1--;
  if(i0>i1)return null;
  const offset=times[i0];
  const sl=(arr)=>arr?arr.slice(i0,i1+1):[];
  return{...me,
    startTime: me.startTime+offset,
    duration:  times[i1]-times[i0],
    time:      sl(times).map(t=>t-offset),
    latlng:    sl(me.latlng),    altitude:   sl(me.altitude),
    heartrate: sl(me.heartrate), cadence:    sl(me.cadence),
    power:     sl(me.power),     distance:   sl(me.distance),
    temperature: sl(me.temperature),
  };
}

function exportStandalone(){
  const tStart = S.trim.start || S.tl.start;
  const tEnd   = S.trim.end   || S.tl.end;
  const hasTrim= S.trim.start!=null || S.trim.end!=null;

  console.log(`[Export] Building standalone HTML… trim:${hasTrim?fmtTime(tStart)+'→'+fmtTime(tEnd):'none'}`);

  // Trim or keep athletes
  let athletes = hasTrim
    ? S.athletes.map(a=>trimAthleteStream(a,tStart,tEnd)).filter(Boolean)
    : S.athletes;

  // Trim or keep FIT
  const me = hasTrim ? trimFitStream(S.me,tStart,tEnd) : S.me;

  // Keep only keyframes within trim range
  const keyframes = S.keyframes.filter(kf=>kf.unix>=tStart&&kf.unix<=tEnd);

  console.log(`[Export] ${athletes.length} athletes · ${me?'FIT ✓':'no FIT'} · ${keyframes.length} keyframes`);
  if(hasTrim&&athletes.length<S.athletes.length)
    console.log(`[Export] ${S.athletes.length-athletes.length} athlete(s) outside trim range excluded`);

  const data={
    athletes,
    me,
    keyframes,
    myActivityId: MY_ACTIVITY_ID,
    trim: hasTrim?{start:tStart,end:tEnd}:null,
  };

  const dataBlob=JSON.stringify(data);
  // Viewer CSS: hide author-only controls and drag-drop overlay
  const viewerStyle=`<style id="__viewer_style__">.author-only{display:none!important}#drop-overlay{display:none!important}</style>`;
  const inject=`\n<script id="__flyby_data__" type="application/json">\n${dataBlob}\n<\/script>\n`;
  let html=document.documentElement.outerHTML;
  html=html.replace(/<script id="__flyby_data__"[\s\S]*?<\/script>/,'');
  html=html.replace(/<style id="__viewer_style__">[\s\S]*?<\/style>/,'');
  html=html.replace('</head>',viewerStyle+'</head>');
  html=html.replace('</body>',inject+'</body>');

  const blob=new Blob([html],{type:'text/html'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='flyby-standalone-'+Date.now()+'.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);

  const kb=Math.round(html.length/1024);
  console.log(`[Export] ✓ ${kb} KB`);
  toast(`Exported ${athletes.length} riders · ${keyframes.length} keyframes${hasTrim?' (trimmed)':''} · ${kb} KB`,'success');
}

function loadEmbedded(){
  const el=document.getElementById('__flyby_data__');
  if(!el)return;
  try{
    const d=JSON.parse(el.textContent);
    if(d.myActivityId) MY_ACTIVITY_ID=d.myActivityId;
    if(d.athletes&&d.athletes.length){
      S.athletes=d.athletes;
      console.log(`[Embedded] ${S.athletes.length} athletes`);
    }
    if(d.me){
      S.me=d.me;
      showTempGauge(d.me.temperature&&d.me.temperature.some(v=>v!=null));
      console.log('[Embedded] FIT data present');
    }
    if(d.keyframes&&d.keyframes.length){
      S.keyframes=d.keyframes;
      console.log(`[Embedded] ${S.keyframes.length} keyframes`);
    }
    // Trim is already baked into the stream data — don't restore S.trim
    // (doing so would cause recomputeRange to double-clip to a zero range)
    if(d.trim) console.log(`[Embedded] Pre-trimmed: ${fmtTime(d.trim.start)} → ${fmtTime(d.trim.end)}`);
  }catch(err){
    console.error('[Embedded] Parse error:',err);
  }
}

// ────────────────────────────────────────────────────────────────
// TOAST
// ────────────────────────────────────────────────────────────────

let toastTmr=null;
function toast(msg,type='info'){
  const el=$f('toast');
  el.textContent=msg; el.className=`show ${type}`;
  clearTimeout(toastTmr);
  toastTmr=setTimeout(()=>el.className='',3800);
}

// ────────────────────────────────────────────────────────────────
// DRAG-AND-DROP  (JSON files onto anywhere on the page)
// ────────────────────────────────────────────────────────────────

(function(){
  let depth=0;
  const ov=$f('drop-overlay');

  function isJson(f){ return f.type==='application/json'||f.name.endsWith('.json'); }
  function isFit(f){ return f.name.toLowerCase().endsWith('.fit'); }
  function hasAccepted(dt){ return Array.from(dt.items||[]).some(i=>isJson({name:i.type==='application/json'?'a.json':''})||i.kind==='file'); }

  document.addEventListener('dragenter',e=>{
    if(!e.dataTransfer.types.includes('Files'))return;
    depth++;
    ov.classList.add('active');
    e.preventDefault();
  });
  document.addEventListener('dragleave',e=>{
    depth--;
    if(depth<=0){depth=0;ov.classList.remove('active');}
  });
  document.addEventListener('dragover',e=>{ e.preventDefault(); });
  document.addEventListener('drop',e=>{
    e.preventDefault();
    depth=0; ov.classList.remove('active');
    const files=Array.from(e.dataTransfer.files);
    const jsonFiles=files.filter(isJson);
    const fitFiles=files.filter(isFit);
    if(jsonFiles.length){
      // Synthesise a fake event to reuse loadAthletes
      loadAthletes({ target:{ files:jsonFiles, value:'' } });
    }
    if(fitFiles.length){
      // Load the first FIT (only one supported at a time)
      loadFit({ target:{ files:fitFiles, value:'' } });
    }
    if(!jsonFiles.length&&!fitFiles.length){
      toast('Drop JSON (athletes) or FIT (your ride) files','warn');
    }
  });
})();

// ────────────────────────────────────────────────────────────────
// KEYBOARD SHORTCUTS
// ────────────────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA')return;
  const step=e.shiftKey?60:10;
  switch(e.key){
    case ' ':       e.preventDefault(); togglePlay(); break;
    case 'ArrowRight': e.preventDefault(); if(S.tl.playing)togglePlay(); S.lastKfUnix=null; seekTo(S.tl.cur+step); break;
    case 'ArrowLeft':  e.preventDefault(); if(S.tl.playing)togglePlay(); S.lastKfUnix=null; seekTo(S.tl.cur-step); break;
    case '+': case '=': if(S.map)S.map.setZoom(S.map.getZoom()+1); break;
    case '-': case '_': if(S.map)S.map.setZoom(S.map.getZoom()-1); break;
    case 'h': case 'H': toggleSidebar(); break;
    case 'f': case 'F': toggleFollow(); break;
    case 'p': case 'P': toggleSort(); break;
    case 'i': case 'I': setTrimStart(); break;
    case 'o': case 'O': setTrimEnd(); break;
  }
});

// ────────────────────────────────────────────────────────────────
// INIT
// ────────────────────────────────────────────────────────────────

function init(){
  initMap();
  initGauges();
  initKfHit();

  // Set follow button state
  $f('follow-btn').classList.toggle('active',S.followCam);

  // Load embedded data (from standalone export)
  loadEmbedded();

  // If embedded data loaded, set up the viewer
  if(S.athletes.length){
    recomputeRange();
    redrawAthletes();
    if(S.me)redrawMe();
    renderList();
    seekTo(S.tl.start);
    $f('nodatamsg').style.display='none';
    $f('mapbadge').style.display='block';
    // Defer canvas draws until after the browser has computed layout
    // (canvas width is 0 if drawn synchronously during script parse)
    requestAnimationFrame(()=>{
      resizeGauges();
      drawTimeline();
      if(S.keyframes.length) S.lastKfUnix=null;
    });
  }

  window.addEventListener('resize',()=>{ resizeGauges(); drawTimeline(); });
}

init();
